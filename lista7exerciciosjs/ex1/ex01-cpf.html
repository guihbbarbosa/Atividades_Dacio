<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Validador de CPF</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      padding: 60px 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 380px;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 1.2rem;
      color: #333;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #555;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover { background: #2563eb; }

    #resultado {
      margin-top: 16px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      display: none;
    }

    .valido   { background: #d1fae5; color: #065f46; }
    .invalido { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Validador de CPF</h2>

    <label>CPF</label>
    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">

    <button onclick="validar()">Validar</button>

    <div id="resultado"></div>
  </div>

  <script>
    function validar() {
      let cpf = document.getElementById('cpf').value.replace(/[^\d]/g, '');
      let res = document.getElementById('resultado');
      res.style.display = 'block';

      if (cpf.length !== 11 || /^(\d)\1+$/.test(cpf)) {
        res.className = 'invalido';
        res.textContent = 'CPF Inválido!';
        return;
      }

      let soma = 0;
      for (let i = 0; i < 9; i++) soma += Number(cpf[i]) * (10 - i);
      let d1 = (soma * 10) % 11;
      if (d1 === 10) d1 = 0;

      soma = 0;
      for (let i = 0; i < 10; i++) soma += Number(cpf[i]) * (11 - i);
      let d2 = (soma * 10) % 11;
      if (d2 === 10) d2 = 0;

      if (d1 === Number(cpf[9]) && d2 === Number(cpf[10])) {
        res.className = 'valido';
        res.textContent = 'CPF Válido!';
      } else {
        res.className = 'invalido';
        res.textContent = 'CPF Inválido!';
      }
    }
  </script>
</body>
</html>
