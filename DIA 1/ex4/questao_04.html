<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Jogador da Copa do Mundo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body,
        html {
            height: 100%;
            margin: 0;
        }

        .bg-copa {
            background-image: url('FIFA-World-Cup-26.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 22rem;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: none;
        }

    
        .card-img-top {
            width: 100%;
            height: 220px;
            object-fit: cover;
            object-position: top;
        }
    </style>
</head>

<body>

    <div class="bg-copa">

        <div class="d-flex flex-column align-items-center">

            <!-- CARD -->
            <div class="card">

                <img src="img_.svg" class="card-img-top" id="fotoJogador">

                <div class="card-body">

                    <h5 id="Nome" class="card-title placeholder-glow">
                        <span class="placeholder col-6"></span>
                        <span id="Rank" class="badge text-bg-secondary">-</span>
                    </h5>

                    <p class="card-text placeholder-glow">
                        <span id="Data_Nas" class="placeholder col-7 d-block mb-2"></span>
                        <span id="Altura" class="placeholder col-5 d-block mb-2"></span>
                        <span id="Posicao" class="placeholder col-8 d-block"></span>
                    </p>

                </div>
            </div>

            <!-- BOTÃO -->
            <button onclick="revelar()" class="btn btn-primary mt-3">
                Revelar
            </button>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
